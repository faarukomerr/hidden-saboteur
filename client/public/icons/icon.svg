<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#120A17"/>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a22"/>
      <stop offset="100%" stop-color="#120A17"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="256" cy="220" r="110" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.3"/>
  <!-- Spy figure body -->
  <circle cx="256" cy="175" r="45" fill="none" stroke="#00F0FF" stroke-width="5" filter="url(#glow)"/>
  <circle cx="256" cy="175" r="20" fill="#00F0FF" opacity="0.15"/>
  <!-- Eyes -->
  <circle cx="242" cy="172" r="6" fill="#00F0FF" filter="url(#glow)"/>
  <circle cx="270" cy="172" r="6" fill="#00F0FF" filter="url(#glow)"/>
  <!-- Body -->
  <path d="M210 330 Q256 280 302 330" fill="none" stroke="#00F0FF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- HIDDEN text -->
  <text x="256" y="410" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="4">HIDDEN</text>
  <!-- SABOTEUR text -->
  <text x="256" y="458" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#00F0FF" letter-spacing="2" opacity="0.9">SABOTEUR</text>
  <!-- Glow dot -->
  <circle cx="256" cy="220" r="4" fill="#FF0055" filter="url(#glow)"/>
</svg>
